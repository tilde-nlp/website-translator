name: Publish Beta Package

on:
  push:
    branches:
      - feature/batch-translation-grouped-sid
  workflow_dispatch:

concurrency:
  group: publish-npm-beta
  cancel-in-progress: false

jobs:
  publish-npm-beta:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Set unique beta version
        run: |
          npm version "8.0.0-beta.${GITHUB_RUN_NUMBER}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing beta version: $VERSION"

      - name: Sync PluginVersion.js
        run: |
          echo "module.exports = '${PACKAGE_VERSION}'" > src/js/PluginVersion.js
          cat src/js/PluginVersion.js

      - name: Build production package
        run: npm run build:prod

      - name: Preview package contents
        run: npm pack --dry-run

      - name: Publish beta package
        run: npm publish --access public --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
